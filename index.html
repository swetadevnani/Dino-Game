<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0f0c29, #302b63, #24243e);
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
    }

    /* Animated star field */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 30%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 80% 10%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 55%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 90%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 70% 65%, rgba(255,255,255,0.6) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .game-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
      padding: 0 20px;
    }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 14px;
    }

    .game-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: white;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .game-title .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #C51B4C;
      box-shadow: 0 0 8px #C51B4C;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .score-display {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      display: flex;
      gap: 20px;
    }

    .score-item span {
      color: white;
      font-weight: 700;
      font-size: 15px;
    }

    .canvas-container {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 30px 80px rgba(0,0,0,0.6),
        0 0 60px rgba(197,27,76,0.12);
    }

    canvas {
      width: 100%;
      display: block;
      cursor: pointer;
    }

    .game-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 14px 4px 0;
    }

    .key-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.3px;
    }

    kbd {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      color: rgba(255,255,255,0.7);
    }

    .credits {
      text-align: center;
      padding-top: 16px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.4px;
      font-style: italic;
    }

    .badge {
      background: rgba(197,27,76,0.15);
      border: 1px solid rgba(197,27,76,0.3);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      color: #e05080;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-header">
      <div class="game-title">
        <div class="dot"></div>

        <div class="score-item">BEST <span id="hi-display">00000</span></div>

      </div>
    </div>

    <div class="canvas-container">
      <canvas id="c" width="820" height="320"></canvas>
    </div>

    <div class="game-footer">

      <div class="badge">Double-jump enabled</div>
      <div class="key-hint">Tap to play on mobile</div>
    </div>

    <p class="credits">an experimental vibe coded by Sweta Devnani</p>
  </div>

// ── Bird heights ───────────────────────────────────────────────────
const BIRD_HEIGHTS = {
  mid:   () => GROUND - 22,
  low:   () => GROUND + 14,
  high:  () => GROUND - 70,
  diver: () => GROUND - 85
};

// ── Game init ──────────────────────────────────────────────────────
function init() {
  dino = { x: 80, y: GROUND, w: DINO_W, h: DINO_H, vy: 0, jumping: false, jumps: 0, dead: false };
  obstacles = []; clouds = []; dustP = [];
  score = 0; speed = BASE_SPEED; frame = 0; animT = 0; state = 'idle';
  hiScore = hiScore || 0;
  nextCactus = 90; nextBird = 150;
}

function jump() {
  if (state === 'idle' || state === 'over') { init(); state = 'run'; return; }
  if (dino.jumps < 2) {
    dino.vy = -14; dino.jumping = true; dino.jumps++;
    for (let i = 0; i < 8; i++)
      dustP.push({ x: dino.x + 10, y: GROUND + dino.h, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 3, life: 1 });
  }
}

document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); } });
canvas.addEventListener('click', jump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

// ── Spawners ───────────────────────────────────────────────────────
function spawnBirds() {
  const pool = ['mid'];
  if (score > 100) pool.push('low');
  if (score > 250) pool.push('high');
  if (score > 400) pool.push('diver');
  const bType = pool[Math.floor(Math.random() * pool.length)];
  let count = 1;
  if (score > 300 && Math.random() < 0.35) count = 2;
  if (score > 500 && Math.random() < 0.25) count = 3;
  const sm = 1.1 + Math.random() * 0.3 + (score > 400 ? 0.1 : 0);
  for (let i = 0; i < count; i++) {
    obstacles.push({
      x: W + 20 + i * 58,
      y: BIRD_HEIGHTS[bType]() + (i > 0 ? (Math.random() - 0.5) * 18 : 0),
      w: 36, h: 24, type: 'bird', birdType: bType,
      speedMult: sm, vy: 0, diving: false, targetY: GROUND + 10, trail: []
    });
  }
}

function spawnCactus() {
  const types = [{ w: 20, h: 40 }, { w: 16, h: 55 }, { w: 36, h: 40 }, { w: 20, h: 70 }];
  const t = types[Math.floor(Math.random() * types.length)];
  obstacles.push({ x: W + 20, y: GROUND + (DINO_H - t.h), w: t.w, h: t.h, type: 'cactus' });
}

function spawnCloud() {
  const idx = Math.floor(Math.random() * 2);
  const scale = idx === 0 ? (0.10 + Math.random() * 0.05) : (0.15 + Math.random() * 0.07);
  clouds.push({ x: W + 60, y: 15 + Math.random() * 75, w: (idx === 0 ? 768 : 449) * scale, h: (idx === 0 ? 322 : 264) * scale, img: cloudImgs[idx], spd: 0.5 + Math.random() * 0.4 });
}

// ── Update ─────────────────────────────────────────────────────────
function updateBird(o) {
  o.x -= speed * o.speedMult;
  if (o.birdType === 'diver' && !o.diving && o.x < W * 0.55) o.diving = true;
  if (o.diving) {
    o.vy += 1.0; o.y += o.vy;
    if (o.y >= o.targetY) { o.y = o.targetY; o.vy = 0; o.diving = false; }
  }
  if (o.birdType === 'diver') {
    o.trail.unshift({ x: o.x + o.w / 2, y: o.y + o.h / 2 });
    if (o.trail.length > 8) o.trail.pop();
  }
}

// ── Draw helpers ───────────────────────────────────────────────────
function drawBird(o) {
  if (o.trail && o.trail.length > 1) {
    for (let i = 1; i < o.trail.length; i++) {
      ctx.globalAlpha = (1 - i / o.trail.length) * 0.3;
      ctx.fillStyle = BIRD_COLOR;
      ctx.fillRect(o.trail[i].x - 3, o.trail[i].y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;
  }
  const wing = Math.floor(frame / 5) % 2;
  ctx.fillStyle = BIRD_COLOR;
  ctx.fillRect(o.x, o.y + 8, o.w, 10);
  ctx.fillRect(o.x + o.w - 6, o.y + 11, 6, 5);
  if (wing) ctx.fillRect(o.x + 4, o.y, 20, 9);
  else      ctx.fillRect(o.x + 4, o.y + 18, 20, 9);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillRect(o.x + o.w - 14, o.y + 9, 4, 4);
}

function drawCactus(o) {
  // Glowing green cactus
  ctx.shadowColor = '#4ade80';
  ctx.shadowBlur = 6;
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(o.x + 6, o.y, 8, o.h);
  ctx.fillRect(o.x, o.y + 12, o.w, 6);
  ctx.fillRect(o.x, o.y + 6, 6, 16);
  ctx.fillRect(o.x + 14, o.y + 8, 6, 14);
  ctx.shadowBlur = 0;
}

function drawDino() {
  if (!dinoImg.complete) return;
  const d = dino;
  const fi = d.dead ? 5 : d.jumping ? 2 : Math.floor(animT / 7) % FRAME_COUNT;
  if (d.dead) {
    ctx.save();
    ctx.drawImage(dinoImg, fi * FRAME_W, 0, FRAME_W, SPRITE_H, d.x, d.y, DINO_W, DINO_H);
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(220,80,80,0.45)';
    ctx.fillRect(d.x, d.y, DINO_W, DINO_H);
    ctx.restore();
  } else {
    ctx.drawImage(dinoImg, fi * FRAME_W, 0, FRAME_W, SPRITE_H, d.x, d.y, DINO_W, DINO_H);
  }
}

function collides(a, b) {
  const p = 5;
  return a.x + p < b.x + b.w - p && a.x + a.w - p > b.x + p && a.y + p < b.y + b.h - p && a.y + a.h - p > b.y + p;
}

// ── Overlay helpers ────────────────────────────────────────────────
function drawRoundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── Main loop ──────────────────────────────────────────────────────
function loop() {
  // Sky gradient background
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#1a1035');
  skyGrad.addColorStop(0.6, '#2d1b69');
  skyGrad.addColorStop(1, '#3d2080');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Subtle grid lines (parallax feel)
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = (frame * 0.5) % 80; x < W; x += 80) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  // Ground fill
  const groundY = GROUND + DINO_H + 12;
  const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
  groundGrad.addColorStop(0, '#1e1040');
  groundGrad.addColorStop(1, '#120a30');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, groundY, W, H - groundY);

  // Ground line with glow
  ctx.shadowColor = '#a78bfa';
  ctx.shadowBlur = 8;
  ctx.strokeStyle = '#7c3aed';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
  ctx.shadowBlur = 0;

  // Ground dashes
  ctx.fillStyle = 'rgba(167,139,250,0.25)';
  for (let i = 0; i < 18; i++) {
    const gx = ((i * 60) - (frame * speed * 0.5) % 60 + 60) % W;
    ctx.fillRect(gx, groundY + 4, 28, 2);
  }

  if (state === 'run') {
    frame++; animT++;
    score += 0.1;
    if (score > hiScore) hiScore = score;
    speed = BASE_SPEED + (MAX_SPEED - BASE_SPEED) * (1 - Math.exp(-score / 800));

    dino.vy += 0.7; dino.y += dino.vy;
    if (dino.y >= GROUND) { dino.y = GROUND; dino.vy = 0; dino.jumping = false; dino.jumps = 0; }

    nextCactus--; nextBird--;
    if (nextCactus <= 0) { spawnCactus(); nextCactus = Math.floor(Math.max(50, 95 - speed * 3) + Math.random() * 30); }
    if (nextBird <= 0)   { spawnBirds(); nextBird   = Math.floor(Math.max(70, 140 - speed * 4) + Math.random() * 60); }

    obstacles.forEach(o => o.type === 'bird' ? updateBird(o) : o.x -= speed);
    obstacles = obstacles.filter(o => o.x > -120);

    if (frame % 90 === 0) spawnCloud();
    clouds.forEach(cl => cl.x -= cl.spd);
    clouds = clouds.filter(cl => cl.x > -300);

    dustP.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.06; });
    dustP = dustP.filter(p => p.life > 0);

    for (const o of obstacles) {
      if (collides(dino, o)) { state = 'over'; dino.dead = true; break; }
    }

    // Update external score display
    scoreEl.textContent = String(Math.floor(score)).padStart(5, '0');
    hiEl.textContent = String(Math.floor(hiScore)).padStart(5, '0');
  }

  // Clouds
  ctx.globalAlpha = 0.18;
  clouds.forEach(cl => { if (cl.img.complete) ctx.drawImage(cl.img, cl.x, cl.y, cl.w, cl.h); });
  ctx.globalAlpha = 1;

  // Dust particles
  dustP.forEach(p => {
    ctx.globalAlpha = p.life * 0.7;
    ctx.fillStyle = '#a78bfa';
    ctx.fillRect(p.x, p.y, 3, 3);
    ctx.globalAlpha = 1;
  });

  obstacles.forEach(o => o.type === 'bird' ? drawBird(o) : drawCactus(o));
  drawDino();

  // Speed indicator as a thin bar at top
  if (state === 'run') {
    const pct = (speed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(0, 0, W, 3);
    const barGrad = ctx.createLinearGradient(0, 0, W * pct, 0);
    barGrad.addColorStop(0, '#7c3aed');
    barGrad.addColorStop(1, '#C51B4C');
    ctx.fillStyle = barGrad;
    ctx.fillRect(0, 0, W * pct, 3);
  }

  // ── IDLE screen ────────────────────────────────────────────────
  if (state === 'idle') {
    ctx.fillStyle = 'rgba(15,10,40,0.6)';
    ctx.fillRect(0, 0, W, H);

    // Title card
    ctx.save();
    drawRoundedRect(W/2 - 200, H/2 - 70, 400, 120, 16);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(167,139,250,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.font = '700 28px "Space Grotesk", sans-serif';
    ctx.fillStyle = 'white';
    ctx.fillText('VOID RUNNER', W / 2, H / 2 - 28);

    ctx.font = '500 14px "Space Grotesk", sans-serif';
    ctx.fillStyle = 'rgba(167,139,250,0.9)';
    ctx.fillText('Press Space or tap to start', W / 2, H / 2 + 4);

    ctx.font = '13px "Space Grotesk", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText('Double-jump available · Survive as long as you can', W / 2, H / 2 + 28);
    ctx.textAlign = 'left';
  }

  // ── GAME OVER screen ──────────────────────────────────────────
  if (state === 'over') {
    ctx.fillStyle = 'rgba(15,10,40,0.7)';
    ctx.fillRect(0, 0, W, H);

    // Card
    ctx.save();
    drawRoundedRect(W/2 - 210, H/2 - 80, 420, 140, 16);
    ctx.fillStyle = 'rgba(197,27,76,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(197,27,76,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    ctx.textAlign = 'center';

    ctx.font = '700 26px "Space Grotesk", sans-serif';
    ctx.fillStyle = '#f87171';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 36);

    ctx.font = '600 15px "Space Mono", monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('SCORE  ' + String(Math.floor(score)).padStart(5,'0') + '   BEST  ' + String(Math.floor(hiScore)).padStart(5,'0'), W / 2, H / 2 - 2);

    // Restart pill
    ctx.save();
    drawRoundedRect(W/2 - 110, H/2 + 16, 220, 38, 19);
    const btnGrad = ctx.createLinearGradient(W/2 - 110, 0, W/2 + 110, 0);
    btnGrad.addColorStop(0, '#7c3aed');
    btnGrad.addColorStop(1, '#C51B4C');
    ctx.fillStyle = btnGrad;
    ctx.fill();
    ctx.restore();

    ctx.font = '600 14px "Space Grotesk", sans-serif';
    ctx.fillStyle = 'white';
    ctx.fillText('Press Space or tap to restart', W / 2, H / 2 + 40);
    ctx.textAlign = 'left';
  }

  requestAnimationFrame(loop);
}

init(); loop();
</script>
</body>
</html>
